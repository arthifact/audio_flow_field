<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Audio-reactive particle flow field." />
    <meta name="theme-color" content="#05070a" />
    <title>Audio Flow Field</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/addons/p5.sound.min.js"></script>
  </head>
  <body>
    <main id="visualizer" aria-label="Audio flow field"></main>
    <section class="controls" aria-label="Audio controls">
      <div class="track-row">
        <p id="filename" class="filename" role="status" aria-live="polite">
          No audio selected
        </p>
        <input
          id="particle-color"
          type="color"
          value="#ff2828"
          aria-label="Particle color"
          title="Particle color"
        />
      </div>
      <input
        id="audio-file"
        type="file"
        accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.aif,.aiff"
        hidden
        aria-label="Choose an audio file"
      />
      <div class="primary-controls">
        <button id="load-audio" class="load-button" type="button">
          Load audio
        </button>
        <button id="play-audio" class="play-button" type="button" disabled>
          Play
        </button>
      </div>
      <div class="secondary-controls">
        <button id="clear-field" type="button">Clear</button>
        <button id="fullscreen" type="button">Fullscreen</button>
      </div>
    </section>
    <details class="help">
      <summary>How to use</summary>
      <p>
        Load or drop an audio file, then press Play. The track loops. Use the
        color swatch to change the trails.
      </p>
      <dl>
        <dt>Space</dt>
        <dd>Play / pause</dd>
        <dt>C</dt>
        <dd>Clear the field</dd>
        <dt>F</dt>
        <dd>Toggle fullscreen</dd>
      </dl>
      <p>
        Bass, midrange, and treble steer the flow. Quiet recordings adjust
        automatically.
      </p>
    </details>
    <div class="drop-overlay" aria-hidden="true">Drop your audio here</div>
    <noscript
      >This visualizer requires JavaScript and a browser with Web Audio
      support.</noscript
    >
    <script type="module" src="src/sketch.js"></script>
  </body>
</html>
